<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#061b1f"/>
    <stop offset="0.48" stop-color="#12372f"/>
    <stop offset="1" stop-color="#244c3c"/>
  </linearGradient>
  <radialGradient id="moonMist" cx="50%" cy="18%" r="62%">
    <stop offset="0" stop-color="#bce8df" stop-opacity=".32"/>
    <stop offset=".5" stop-color="#7ec1b5" stop-opacity=".09"/>
    <stop offset="1" stop-color="#31564d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="villageGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ffd78a" stop-opacity=".78"/>
    <stop offset=".45" stop-color="#f4ac5b" stop-opacity=".18"/>
    <stop offset="1" stop-color="#f4ac5b" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="33" result="noise"/><feColorMatrix in="noise" type="matrix" values=".22 0 0 0 0 0 .28 0 0 0 0 0 .24 0 0 0 0 0 .15 0"/><feBlend in="SourceGraphic" mode="soft-light"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<rect width="1600" height="900" fill="url(#moonMist)"/>

<!-- distant ridge -->
<path d="M0 290 C140 235 270 258 390 228 C520 195 590 245 700 218 C825 188 900 238 1030 205 C1180 165 1320 215 1600 150 L1600 455 L0 455Z" fill="#0c2a25" opacity=".98"/>
<path d="M0 350 C180 285 300 330 470 285 C610 248 770 306 910 264 C1080 215 1240 285 1600 230 L1600 505 L0 505Z" fill="#12362d" opacity=".94"/>

<!-- distant tree silhouettes -->
<g fill="#0a2521" opacity=".94">
  <circle cx="65" cy="270" r="150"/><circle cx="205" cy="248" r="118"/><circle cx="335" cy="270" r="145"/>
  <circle cx="1260" cy="255" r="142"/><circle cx="1410" cy="226" r="170"/><circle cx="1540" cy="270" r="130"/>
</g>
<g fill="#184337" opacity=".75">
  <circle cx="490" cy="305" r="90"/><circle cx="610" cy="285" r="118"/><circle cx="990" cy="278" r="116"/><circle cx="1120" cy="300" r="88"/>
</g>

<!-- distant village entrance, warm continuity with Sunpetal Village -->
<g transform="translate(150 160) scale(.72)">
  <ellipse cx="230" cy="215" rx="280" ry="160" fill="url(#villageGlow)" filter="url(#soft)"/>
  <path d="M40 260 L150 168 L262 260Z" fill="#5c3b2d"/>
  <rect x="67" y="257" width="170" height="118" rx="9" fill="#6d5a45"/>
  <rect x="105" y="292" width="42" height="58" rx="8" fill="#ffd789" opacity=".9"/>
  <rect x="168" y="288" width="35" height="50" rx="8" fill="#ffd789" opacity=".78"/>
  <path d="M265 282 L340 220 L418 282Z" fill="#55372a"/>
  <rect x="282" y="279" width="120" height="90" rx="8" fill="#66533f"/>
  <rect x="317" y="310" width="34" height="42" rx="7" fill="#ffc976" opacity=".82"/>
</g>

<!-- warm path glints leading away from village -->
<path d="M330 352 C410 380 500 418 575 472" stroke="#d7a865" stroke-width="10" stroke-linecap="round" opacity=".13" fill="none"/>
<g fill="#f7d48a" opacity=".72">
  <circle cx="328" cy="350" r="5"/><circle cx="382" cy="377" r="4"/><circle cx="433" cy="402" r="4"/><circle cx="492" cy="431" r="3.5"/>
</g>

<!-- high canopy -->
<g fill="#09241e">
  <path d="M0 0 H1600 V70 C1470 30 1350 102 1230 75 C1080 42 960 108 820 72 C650 28 560 100 405 70 C245 39 130 110 0 70Z"/>
  <circle cx="150" cy="30" r="130"/><circle cx="360" cy="38" r="110"/><circle cx="1250" cy="25" r="125"/><circle cx="1470" cy="38" r="145"/>
</g>

<!-- atmospheric shafts -->
<g opacity=".09" fill="#b8efe1">
  <path d="M520 0 L690 0 L830 600 L625 600Z"/>
  <path d="M940 0 L1060 0 L1125 560 L970 560Z"/>
</g>

<!-- subtle texture -->
<rect width="1600" height="900" fill="transparent" filter="url(#grain)" opacity=".48"/>
</svg>
