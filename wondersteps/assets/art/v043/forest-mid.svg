</g>

<!-- magical mushrooms -->
<g>
  <g transform="translate(248 628)"><ellipse cx="0" cy="0" rx="48" ry="35" fill="url(#mossGlow)" filter="url(#soft)"/><rect x="-4" y="3" width="8" height="24" rx="4" fill="#c5ddd1"/><path d="M-18 5 Q0 -19 18 5Z" fill="#74cfe3" stroke="#b6eff8" stroke-width="3"/></g>
  <g transform="translate(315 682) scale(.7)"><ellipse cx="0" cy="0" rx="48" ry="35" fill="url(#mossGlow)" filter="url(#soft)"/><rect x="-4" y="3" width="8" height="24" rx="4" fill="#c5ddd1"/><path d="M-18 5 Q0 -19 18 5Z" fill="#a48ae2" stroke="#d6c9ff" stroke-width="3"/></g>
  <g transform="translate(1312 642) scale(.9)"><ellipse cx="0" cy="0" rx="48" ry="35" fill="url(#mossGlow)" filter="url(#soft)"/><rect x="-4" y="3" width="8" height="24" rx="4" fill="#c5ddd1"/><path d="M-18 5 Q0 -19 18 5Z" fill="#77d8e7" stroke="#c1f4fb" stroke-width="3"/></g>
  <g transform="translate(1240 715) scale(.63)"><ellipse cx="0" cy="0" rx="48" ry="35" fill="url(#mossGlow)" filter="url(#soft)"/><rect x="-4" y="3" width="8" height="24" rx="4" fill="#c5ddd1"/><path d="M-18 5 Q0 -19 18 5Z" fill="#9d83dc" stroke="#d6c9ff" stroke-width="3"/></g>
</g>

<!-- flowers -->
<g fill="#8874bf" opacity=".9"><circle cx="300" cy="740" r="7"/><circle cx="340" cy="760" r="6"/><circle cx="1265" cy="770" r="7"/><circle cx="1310" cy="742" r="6"/></g>
<g fill="#d8d59a" opacity=".85"><circle cx="288" cy="790" r="5"/><circle cx="390" cy="820" r="4"/><circle cx="1220" cy="815" r="5"/></g>
</svg>
